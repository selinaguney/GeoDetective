
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GeoDetective | Traces of Time</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
    <div class="brand">⌖ GEODETECTIVE</div>
    <div class="subtitle">TRACES OF TIME</div>
</header>

<main>

    <!-- MAIN MENU -->
    <section id="main-menu">

        <div class="intro">
            <p class="eyebrow">THE INVESTIGATION ARCHIVE</p>
            <h1>Every location tells a story.</h1>
            <p>
                Examine evidence. Follow the timeline.
                Uncover the truth.
            </p>
        </div>

        <div id="case-list" class="case-list"></div>

    </section>

    <!-- GAME -->
    <section id="game-screen" class="hidden">

        <div class="game-topbar">
            <button id="back-btn" class="outline-btn">
                ← Main Menu
            </button>

            <h2 id="case-title">The Missing Professor</h2>

            <div class="timer">
                TIME <strong id="timer">03:00</strong>
            </div>
        </div>

        <div class="game-layout">

            <div class="map-area">

                <div id="map"></div>

                <div class="map-footer">
                    <span id="map-coordinates">
                        LAT: — | LNG: —
                    </span>
                    <span id="map-mode">
                        Investigation Map
                    </span>
                </div>

            </div>

            <aside class="investigation-panel">

                <div class="case-meta">
                    <span id="stage-number">MISSION 01 / 04</span>
                    <span id="case-district">ANKARA</span>
                </div>

                <h3 id="mission-title"></h3>

                <div id="timeline" class="timeline"></div>

                <p id="mission-description"></p>

                <div id="evidence-documents"></div>

                <div class="objective">
                    <strong>YOUR OBJECTIVE</strong>
                    <p id="mission-objective"></p>
                </div>

                <div id="mission-actions"></div>

                <div id="feedback"
                     class="feedback"
                     role="status"
                     aria-live="polite"></div>

                <div class="board-title">
                    <span>EVIDENCE BOARD</span>
                    <span id="progress-text">0 / 4</span>
                </div>

                <div class="progress-track">
                    <div id="progress-fill"></div>
                </div>

                <div id="evidence-list"></div>

            </aside>
        </div>

    </section>

</main>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/map.js"></script>
<script src="js/game.js"></script>
<script src="js/museum.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="js/cipher.js"></script>
<script src="js/main.js"></script>

</body>
</html>
